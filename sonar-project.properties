# SonarQube Cloud — projeto da lambda (auth-cpf + jwt-authorizer).
# Organização e projectKey são passados pelo workflow (vars.SONAR_ORGANIZATION /
# vars.SONAR_PROJECT_KEY) para não duplicar configuração por repositório.
sonar.sources=src
sonar.tests=test
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.exclusions=build/**,terraform/**,**/__pycache__/**,**/*.json
sonar.sourceEncoding=UTF-8
