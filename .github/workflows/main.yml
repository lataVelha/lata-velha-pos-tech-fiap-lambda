name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Push pra master builda e aplica de verdade (terraform apply).
  # workflow_dispatch existe pra permitir disparo manual (com destroy=true,
  # por exemplo) fora de um push.
  workflow_dispatch:
    inputs:
      destroy:
        description: "Destruir as lambdas (e a anexação delas no API Gateway) em vez de aplicar"
        type: boolean
        default: false
  # Reusavel: dá pra chamar de fora (ex: mono repo) com
  # "uses: lataVelha/lata-velha-pos-tech-fiap-lambda/.github/workflows/main.yml@master".
  # Pra isso funcionar, este repo precisa permitir acesso de fora em
  # Settings > Actions > General > Access.
  workflow_call:
    inputs:
      aws_region:
        description: "Regiao AWS (default: var AWS_REGION deste repo)"
        type: string
        required: false
      destroy:
        description: "Destruir as lambdas em vez de aplicar"
        type: boolean
        required: false
        default: false
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: false
      SONAR_TOKEN:
        required: false

jobs:
  # ============================================================
  # CI · TESTES
  # Testes + cobertura isolados do build/Terraform. É este job que deve
  # ser exigido no ruleset: falha de build/AWS não bloqueia o PR.
  # Roda só no repositório da lambda: quando o mono chama este workflow
  # (workflow_call), o `github.repository` é o do mono e o job é pulado.
  # ============================================================
  test:
    name: "CI · Testes"
    if: inputs.destroy != true && github.repository == 'lataVelha/lata-velha-pos-tech-fiap-lambda'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Testes com cobertura (mínimo 80%)
        run: |
          pip install -r requirements/dev.txt
          # --cov=<pacote> (e não --cov=src) para o coverage.xml sair com
          # caminhos "src/lata_velha_auth/..." e casar com sonar.sources=src.
          pytest -q --cov=lata_velha_auth --cov-report=xml:coverage.xml --cov-report=html --cov-fail-under=80

      - name: Calcular cobertura
        id: cobertura
        if: failure()
        run: |
          if [ -f coverage.xml ]; then
            PCT=$(python3 -c 'import xml.etree.ElementTree as ET; r=ET.parse("coverage.xml").getroot(); rate=r.get("line-rate") or 0; print(round(100*float(rate),1))')
          else
            PCT="n/a"
          fi
          echo "pct=${PCT}" >> "$GITHUB_OUTPUT"

      - name: Comentar cobertura no PR
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          PCT: ${{ steps.cobertura.outputs.pct }}
        with:
          script: |
            const pct = process.env.PCT || 'n/a';
            const marker = '<!-- cobertura-check -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = pct === 'n/a'
              ? `${marker}\n## ❌ Os testes falharam antes de gerar a cobertura\n\nO check \`CI · Testes\` falhou, mas o \`coverage.xml\` não foi gerado (erro de import ou falha em teste).\n\n**O que fazer:** abra o [log do job](${runUrl}), corrija a falha e rode \`pytest -q\` localmente antes de enviar.\n\n_O merge fica bloqueado enquanto este check estiver vermelho._`
              : `${marker}\n## ❌ Cobertura de testes abaixo do mínimo\n\nA cobertura ficou em **${pct}%**, abaixo do mínimo de **80%** exigido pelo \`--cov-fail-under=80\`.\n\n**Para liberar o merge:**\n1. Rode \`pytest --cov=lata_velha_auth --cov-report=term-missing\` localmente.\n2. Cubra os arquivos com menor cobertura.\n3. Envie os testes até o check \`CI · Testes\` ficar verde.\n\n[Ver relatório e logs do run](${runUrl})`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100
            });
            const previous = comments.find(c => c.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      - name: Resumo da falha
        if: failure()
        run: |
          PCT="${{ steps.cobertura.outputs.pct }}"
          if [ "$PCT" = "n/a" ]; then
            echo "### ❌ Testes falharam (sem relatório de cobertura)" >> "$GITHUB_STEP_SUMMARY"
            echo "Abra o log do job para ver o erro de import/teste." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Testes falharam antes de gerar a cobertura. Veja o log do job."
          else
            echo "### ❌ Cobertura: ${PCT}% (mínimo 80%)" >> "$GITHUB_STEP_SUMMARY"
            echo "Veja o comentário no PR para saber o que fazer." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Cobertura ${PCT}% abaixo do mínimo de 80%. O PR foi comentado com as instruções."
          fi

      - name: Limpar aviso de cobertura
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- cobertura-check -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100
            });
            for (const c of comments.filter(c => c.body.includes(marker))) {
              await github.rest.issues.deleteComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: c.id });
            }
      - name: Publicar relatório HTML de cobertura
        if: failure() && hashfiles('htmlcov/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov
          retention-days: 7

      - name: Publicar cobertura (para o Sonar)
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 1

  # ============================================================
  # CI · SONARQUBE CLOUD
  # Consome a cobertura gerada pelo job de testes (sem rodar pytest de novo).
  # ============================================================
  sonar:
    name: "CI · SonarQube Cloud"
    needs: test
    if: inputs.destroy != true && github.repository == 'lataVelha/lata-velha-pos-tech-fiap-lambda'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Sem o secret (ex.: PR de fork) a análise é pulada.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar: histórico completo para SCM/blame

      - name: Baixar cobertura
        uses: actions/download-artifact@v4
        with:
          name: coverage

      - name: SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || format('{0}_{1}', github.repository_owner, github.event.repository.name) }}

  # ============================================================
  # CI · PLANO
  # Builda as duas lambdas (build/ precisa existir — o data source
  # archive_file le do disco mesmo num "terraform plan") e roda
  # terraform plan em todo PR, sem aplicar nada.
  # ============================================================
  plan:
    name: "CI · Build + Terraform plan"
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: terraform/deploy

    steps:
      # Job só roda em pull_request (nunca via workflow_call), então o
      # checkout padrão (código da própria PR) já é o certo aqui.
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Build (empacota pra deploy — wheels Linux x86_64)
        working-directory: .
        run: ./build.sh

      - name: Autenticar na AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Instalar Terraform 1.10
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.x"

      - name: Resolver bucket de estado (S3)
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "STATE_BUCKET=lata-velha-tfstate-${ACCOUNT_ID}" >> $GITHUB_ENV

      - name: Terraform Init
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}"

      - name: Terraform Plan
        run: terraform plan
        env:
          TF_VAR_region:       ${{ vars.AWS_REGION || 'us-east-1' }}
          TF_VAR_state_bucket: ${{ env.STATE_BUCKET }}

  # ============================================================
  # CD · PROVISIONAR LAMBDAS (auth-cpf + jwt-authorizer)
  # Depende do bootstrap (VPC/subnets), do addons (API Gateway) e do
  # os-service (endpoint/credenciais do RDS proprio dele). A auth-cpf
  # consulta esse RDS; a authorizer e registrada no API Gateway e o
  # stack edge le o jwt_authorizer_id daqui.
  # Só roda em push para master (nunca em PR).
  # ============================================================
  tf-apply:
    name: "CD · Provisionar lambdas · auth-cpf + jwt-authorizer"
    needs: test
    if: >
      always() && inputs.destroy != true &&
      (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' ||
       (github.ref == 'refs/heads/master' && github.event_name == 'push')) &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    concurrency:
      group: lambda-deploy
      cancel-in-progress: false

    defaults:
      run:
        working-directory: terraform/deploy

    env:
      REGION: ${{ inputs.aws_region || vars.AWS_REGION || 'us-east-1' }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          repository: lataVelha/lata-velha-pos-tech-fiap-lambda
          ref: master

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Build (empacota pra deploy — wheels Linux x86_64)
        working-directory: .
        run: ./build.sh

      - name: Autenticar na AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.REGION }}

      - name: Instalar Terraform 1.10
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.x"

      - name: Resolver bucket de estado (S3)
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="lata-velha-tfstate-${ACCOUNT_ID}"
          echo "STATE_BUCKET=${BUCKET}" >> $GITHUB_ENV
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3 mb "s3://$BUCKET" --region "${{ env.REGION }}"
            aws s3api put-bucket-versioning \
              --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
          fi

      - name: Terraform Init
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="region=${{ env.REGION }}"

      # TF_VAR_jwt_private_key_pem/jwt_public_key_pem NAO sao passadas
      # aqui de proposito: as variaveis ja tem como default o mesmo
      # conteudo de app.key/app.pub do os-service (ver
      # terraform/deploy/variables.tf). Se as chaves forem rotacionadas,
      # atualize os defaults la ou cadastre TF_JWT_PRIVATE_KEY_PEM/
      # TF_JWT_PUBLIC_KEY_PEM como secrets deste repo.
      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          TF_VAR_region:       ${{ env.REGION }}
          TF_VAR_state_bucket: ${{ env.STATE_BUCKET }}

      - name: Exportar ARNs das lambdas
        run: terraform output

  # ============================================================
  # CD · DESTROY DAS LAMBDAS
  # Remove auth-cpf + jwt-authorizer e as anexações no API Gateway —
  # equivalente ao "./apply.sh --destroy". Rode DEPOIS do edge e ANTES
  # do os-service/addons (a lambda le o state do os-service e a
  # authorizer e referenciada pelo edge).
  # Só roda quando chamado com destroy=true.
  # ============================================================
  destroy:
    name: "CD · Destruir lambdas · auth-cpf + jwt-authorizer"
    if: inputs.destroy == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    concurrency:
      group: lambda-deploy
      cancel-in-progress: false

    defaults:
      run:
        working-directory: terraform/deploy

    env:
      REGION: ${{ inputs.aws_region || vars.AWS_REGION || 'us-east-1' }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          repository: lataVelha/lata-velha-pos-tech-fiap-lambda
          ref: master

      - name: Autenticar na AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.REGION }}

      - name: Instalar Terraform 1.10
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.x"

      - name: Resolver bucket de estado (S3)
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "STATE_BUCKET=lata-velha-tfstate-${ACCOUNT_ID}" >> $GITHUB_ENV

      - name: Criar diretórios vazios para archive_file
        run: |
          mkdir -p ${{ github.workspace }}/build/auth-cpf
          mkdir -p ${{ github.workspace }}/build/jwt-authorizer
          touch ${{ github.workspace }}/build/auth-cpf/.gitkeep
          touch ${{ github.workspace }}/build/jwt-authorizer/.gitkeep
          ls -la ${{ github.workspace }}/build/

      - name: Terraform Init
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="region=${{ env.REGION }}"

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
        env:
          TF_VAR_region:       ${{ env.REGION }}
          TF_VAR_state_bucket: ${{ env.STATE_BUCKET }}
